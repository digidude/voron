######################################################################
##  Configuration for FANS
######################################################################

##--------------------------------------------------------------------
##  Part Cooling Fan - CNC_FAN0
##--------------------------------------------------------------------

[fan]
pin: PA8
kick_start_time: 0.5
off_below: 0.10

##--------------------------------------------------------------------
##  Hotend Fan - CNC_FAN1
##--------------------------------------------------------------------

[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

##--------------------------------------------------------------------
##  Controller Fan - CNC_FAN2
##--------------------------------------------------------------------

[heater_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0


##--------------------------------------------------------------------
##  Exhaust Filter Fan - CNC_FAN3
##--------------------------------------------------------------------

[heater_fan exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0

##--------------------------------------------------------------------
##  NEVERMORE Fan - CNC_FAN4 (?)
##--------------------------------------------------------------------

[heater_fan nevermore_fan]
pin: PD14
heater: heater_bed
heater_temp: 45.0
fan_speed: 1.0

