######################################################################
##  A/B DRIVE STEPPERS
######################################################################

##====================================================================
##  X Stepper on MOTOR0 (B Drive)
##====================================================================

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

position_min: -2
position_max: 249

endstop_pin: PG6
position_endstop: 248

homing_speed: 100   #Max 100
homing_retract_dist: 2
homing_positive_dir: true

##--------------------------------------------------------------------
##  X Stepper Driver 
##--------------------------------------------------------------------

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Y Stepper on MOTOR1 (A Drive)
##====================================================================

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15

rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

position_min: 0
position_max: 255

endstop_pin: PG9
position_endstop: 254

homing_speed: 100  #Max 100
homing_retract_dist: 2
homing_positive_dir: true

##--------------------------------------------------------------------
##  Y Stepper Driver
##--------------------------------------------------------------------

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


######################################################################
##  Z DRIVE STEPPERS
######################################################################

##====================================================================
##  Z0 Stepper on MOTOR2 (Front Left)
##====================================================================

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

## Z Stop and Homing info (for all Z Drives)

position_min: -2
position_max: 240

endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop

homing_speed: 10
second_homing_speed: 1

#homing_retract_dist: 0   -- uncomment for omron style probe
homing_retract_dist: 0 # needs to be set 0 for beacon.  For omron style set 5 and lower at discretion if desired

##--------------------------------------------------------------------
##  Z0 Stepper Driver
##--------------------------------------------------------------------

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z1 Stepper on MOTOR3 (Rear Left)
##====================================================================

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##--------------------------------------------------------------------
##  Z1 Stepper Driver
##--------------------------------------------------------------------

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z2 Stepper on MOTOR4 (Rear Right)
##====================================================================

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##--------------------------------------------------------------------
##  Z2 Stepper Driver
##--------------------------------------------------------------------

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z3 Stepper on MOTOR5 (Front Right)
##====================================================================

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##--------------------------------------------------------------------
##  Z3 Stepper Driver
##--------------------------------------------------------------------

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0