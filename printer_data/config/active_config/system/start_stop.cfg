######################################################################
##  PRINT_START_beacon macro
######################################################################

[gcode_macro PRINT_START]
gcode:
  {% set bedtemp = params.BED|int %}          # set variabale 'bedtemp' from params passed from slicer
  {% set hotendtemp = params.HOTEND|int %}    # set variabale 'hotend' from params passed from slicer
  #{% set chambertemp = params.CHAMBER|default(0)|int %}  uncomment when using chamber temp

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0

  STATUS_HOMING                               ### set toolhead LEDs to 'homing' for G28
  G28                                         # initial home
  G90                                         # absolute positioning

  G0 Z2                                       # move 2mm over bed for heatsoak
  STATUS_HEATING                              ### set toolhead LEDs to 'heating' while waiting for bed temp
  
  #M104 S{0.75 * hotendtemp}                   # set hotend to 80% final temp to prevent oozing during routine
  
  M104 S{150}
  M190 S{bedtemp}                             # set and wait for bed temp to begin heatsoak
  
  #TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp}  uncomment when using chamber temp
  
  G32 PARK=0                                  # home, qgl, rehome - LEDs commands are sent within G32

  dynamic_clean WIPES=1

  G28 Z METHOD=CONTACT CALIBRATE=1
  
  STATUS_MESHING                              # set toolhead LEDs to 'meshing' for calibrating mesh
  BED_MESH_CALIBRATE ADAPTIVE=0               # perform adaptive bed mesh across populated area of bed

  dynamic_clean WIPES=3

  G28 Z METHOD=CONTACT CALIBRATE=0
  
  #BED_MESH_PROFILE load=default
  STATUS_HEATING                              # set toolhead LEDs to 'heating' for final extruder heating

  G1 X80 Y255 Z40 F6000        ; move over purge bucket
  M109 S{hotendtemp}                          # extruder final heating set and wait

  dynamic_clean WIPES=2
  
  #G28 Z                        ; final full temp z home
  
  #BUCKET_PURGE                               # move to purge bucket and extrude before clean_nozzle macro

  SET_GCODE_OFFSET Z=0.04
 
  _purge_clean                                # move to brush and run nozzle cleaning macro
  _PURGE_LINE
  
  STATUS_PRINTING                             # set toolhead LEDs to 'printing' and start!


######################################################################
##  PRINT_START macro
######################################################################

[gcode_macro PRINT_START_temp]
gcode:
  {% set bedtemp = params.BED|int %}          # set variabale 'bedtemp' from params passed from slicer
  {% set hotendtemp = params.HOTEND|int %}    # set variabale 'hotend' from params passed from slicer
  #{% set chambertemp = params.CHAMBER|default(0)|int %}  uncomment when using chamber temp

  STATUS_HOMING                               ### set toolhead LEDs to 'homing' for G28
  G28                                         # initial home
  G90                                         # absolute positioning
  STATUS_HEATING                              ### set toolhead LEDs to 'heating' while waiting for bed temp
  M104 S{0.75 * hotendtemp}                   # set hotend to 80% final temp to prevent oozing during routine
  M190 S{bedtemp}                             # set and wait for bed temp to begin heatsoak
  
  #TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp}  uncomment when using chamber temp
  G32 PARK=0                                  # home, qgl, rehome - LEDs commands are sent within G32
  STATUS_MESHING                              # set toolhead LEDs to 'meshing' for calibrating mesh
 # BED_MESH_CALIBRATE ADAPTIVE=1               # perform adaptive bed mesh across populated area of bed
  BED_MESH_PROFILE load=default
  STATUS_HEATING                              # set toolhead LEDs to 'heating' for final extruder heating

  G1 X80 Y255 Z40 F6000        ; move over purge bucket
  M109 S{hotendtemp}                          # extruder final heating set and wait

  dynamic_clean WIPES=1
  
  G28 Z                        ; final full temp z home
  
  #BUCKET_PURGE                               # move to purge bucket and extrude before clean_nozzle macro
 
  _purge_clean                                # move to brush and run nozzle cleaning macro
  _PURGE_LINE
  
  STATUS_PRINTING                             # set toolhead LEDs to 'printing' and start!

######################################################################
##  PRINT_END macro
######################################################################

[gcode_macro PRINT_END]
gcode:
  M400                           ; wait for buffer to clear
  G92 E0                         ; zero the extruder
  G1 E-10.0 F3600                ; retract filament
  G91                            ; relative positioning
  G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
  G90
  CLEAN_NOZZLE
  TURN_OFF_HEATERS
  M107                           ; turn off fan

  
  G90                            ; absolute positioning
  G0 X125 Y250 Z50 F3600         ; park nozzle at rear
  STATUS_READY
  BED_MESH_CLEAR