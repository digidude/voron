######################################################################
##  EXTRUDER
######################################################################

##====================================================================
##  E0 on MOTOR6
##====================================================================

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4

#stock rotation_distance: 22.6789511
rotation_distance: 22.1
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.75

heater_pin: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4

min_temp: -200
max_temp: 270
max_power: 1.0
min_extrude_temp: 0

#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721

pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

##--------------------------------------------------------------------
##  E0 Stepper Driver
##--------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0


######################################################################
##  BED HEATER
######################################################################

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF3

max_power: 0.6
min_temp: -250
max_temp: 120

#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769