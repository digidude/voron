[gcode_macro display]
gcode:
    {% set FOO = printer["extruder"].temperature %}
    M118 FOO: {FOO}
    {% set BAR = printer.extruder.temperature %}
    M118 BAR: {BAR}
    {% if printer.extruder.temperature > 200.0 %}
      M118 "Temp is good"
    {% else %}
      M118 "Below Temp"
    {% endif %}

