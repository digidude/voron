######################################################################
##  exhaust_fan_v2.cfg  -- PROPOSED (draft 2026-10-03)
##
##  Problem: [heater_fan exhaust_fan] in fans.cfg runs at 100% whenever
##  the bed is > 60C, pulling heat out of the chamber during ABS/ASA prints.
##
##  This replaces it with a fan Klipper macros can control:
##   - ABS/ASA (bed >= 90C): exhaust OFF while printing (Nevermore still
##     filters, it's unchanged)
##   - PLA/PETG (bed < 90C): exhaust at 60% to keep the chamber cool
##   - PRINT_END: 100% for 5 min to clear fumes, then off
##  Manual control any time:  SET_FAN_SPEED FAN=exhaust_fan SPEED=0.5
##
##  Install:
##   1. In active_config/system/fans.cfg DELETE the whole
##      [heater_fan exhaust_fan] section (Klipper won't allow PD13 twice)
##   2. Copy this file to active_config/system/ and add to printer.cfg:
##        [include active_config/system/exhaust_fan_v2.cfg]
##   3. FIRMWARE_RESTART
######################################################################

[fan_generic exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5


[gcode_macro _EXHAUST]
## MODE=print BED=<temp> | MODE=end | MODE=off
variable_hot_bed_threshold: 90
variable_speed_hot: 0.0       # ABS/ASA while printing
variable_speed_cool: 0.6      # PLA/PETG while printing
variable_end_speed: 1.0
variable_end_minutes: 5
gcode:
  {% set mode = params.MODE|default("print")|lower %}
  {% if mode == "print" %}
    {% set bed = params.BED|default(0)|int %}
    {% set s = speed_hot if bed >= hot_bed_threshold else speed_cool %}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED={s}
  {% elif mode == "end" %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED={end_speed}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION={end_minutes * 60}
  {% else %}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
  {% endif %}


[delayed_gcode _EXHAUST_OFF]
gcode:
  SET_FAN_SPEED FAN=exhaust_fan SPEED=0
