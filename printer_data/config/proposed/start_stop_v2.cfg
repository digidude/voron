######################################################################
##  start_stop_v2.cfg  -- PROPOSED drop-in replacement for
##  active_config/system/start_stop.cfg   (draft 2026-10-03)
##
##  NOT included anywhere yet. To try it:
##    1. back up active_config/system/start_stop.cfg
##    2. copy this file over it (same macro names: PRINT_START, PRINT_END)
##    3. FIRMWARE_RESTART
##
##  What changed vs. current PRINT_START:
##   - Bed + hotend(150) heat in parallel with homing
##   - Retry-aware: skips G28 / QGL / soak if the machine is still homed,
##     leveled and hot from the previous attempt (FULL=1 forces everything)
##   - Optional heat soak (auto 10 min for bed >= 90C, first attempt only)
##   - 1 contact Z home instead of 4-6 homes; adaptive mesh
##   - Contact home always happens at a controlled 140-160C nozzle
##   - Purge rewritten for relative E: small retracts, no long dwells
##   - Prints elapsed time per phase to the console ("PS: ...")
##
##  Slicer start gcode stays the same:
##    PRINT_START HOTEND=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]
##  Optional params: SOAK=<minutes>  FULL=1  MESH=0
######################################################################

[gcode_macro PRINT_START]
variable_contact_temp: 150      # nozzle temp for Beacon contact homing (max 180)
variable_z_hot_offset: 0.04     # hot-nozzle expansion comp (Beacon docs suggest ~0.06 start) -- TUNE
variable_hot_bed_threshold: 90  # bed temps >= this are treated as ABS/ASA (soak)
variable_auto_soak_min: 10      # default soak minutes for hot-bed materials
gcode:
  {% set BED     = params.BED|default(100)|int %}
  {% set HOTEND  = params.HOTEND|default(250)|int %}
  {% set FULL    = params.FULL|default(0)|int %}
  {% set MESH    = params.MESH|default(1)|int %}

  # ---- decide what can be skipped (evaluated once, at macro start) ----
  {% set homed   = "xyz" in printer.toolhead.homed_axes %}
  {% set leveled = printer.quad_gantry_level.applied %}
  {% set bed_hot = printer.heater_bed.temperature >= BED - 15 %}   # still warm from last attempt
  {% set retry   = homed and leveled and bed_hot and FULL == 0 %}

  {% if params.SOAK is defined %}
    {% set SOAK = params.SOAK|int %}
  {% elif BED >= hot_bed_threshold and not retry %}
    {% set SOAK = auto_soak_min %}
  {% else %}
    {% set SOAK = 0 %}
  {% endif %}

  _PS_MARK RESET=1
  {% if retry %}
    M118 PS: RETRY mode - skipping home/QGL/soak (use FULL=1 to force)
  {% endif %}

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0
  G90

  # ---- optional add-ons (only run if their files are installed) ----
  {% if 'gcode_macro _KEEP_HOT_ARM' in printer %}
    _KEEP_HOT_ARM BED={BED}               # cancel any keep-hot timer, remember temps
  {% endif %}
  {% if 'gcode_macro _EXHAUST' in printer %}
    _EXHAUST MODE=print BED={BED}         # exhaust off for ABS/ASA, low for PLA/PETG
  {% endif %}

  # ---- 1. start heating everything at once ----
  STATUS_HEATING
  M140 S{BED}
  M104 S{contact_temp}

  # ---- 2. home XY/Z while the bed heats (skipped on retry) ----
  {% if not homed or FULL == 1 %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={contact_temp + 10}
    STATUS_HOMING
    G28                                   # contact home + autocalibrate when unhomed
    _PS_MARK MSG="homed"
  {% endif %}

  # park low over the bed centre: keeps the toolhead warm, out of the way
  G0 X125 Y125 Z5 F6000

  # ---- 3. bed temp + optional soak ----
  STATUS_HEATING
  M190 S{BED}
  _PS_MARK MSG="bed at temp"
  {% if SOAK > 0 %}
    M118 PS: heat soak {SOAK} min (override with SOAK=0)
    {% for m in range(SOAK) %}
      M118 PS: soak {SOAK - m} min left
      G4 P60000
    {% endfor %}
    _PS_MARK MSG="soak done"
  {% endif %}

  # ---- 4. recalibrate Beacon on the HOT bed (first run only), then QGL ----
  #  Beacon's proximity model is temperature-sensitive; the first G28 above
  #  calibrated it on a cold bed. Beacon docs: CALIBRATE=1 after heat soak.
  {% if not leveled or FULL == 1 %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={contact_temp - 10} MAXIMUM={contact_temp + 10}
    G28 Z METHOD=CONTACT CALIBRATE=1
    _PS_MARK MSG="beacon calibrated hot"
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    _PS_MARK MSG="QGL done"
  {% endif %}

  # ---- 5. clean nozzle, then one contact Z home at a controlled temp ----
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={contact_temp - 10} MAXIMUM={contact_temp + 10}
  dynamic_clean WIPES=2
  STATUS_CALIBRATING_Z
  G28 Z METHOD=CONTACT CALIBRATE=0
  _PS_MARK MSG="contact Z"

  # ---- 6. adaptive mesh (Beacon proximity scan) ----
  {% if MESH == 1 %}
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1
    _PS_MARK MSG="mesh done"
  {% endif %}

  # ---- 7. final hotend heat over the purge bucket ----
  STATUS_HEATING
  G0 Z10 F1500
  G0 X120 Y255 F6000
  M109 S{HOTEND}
  _PS_MARK MSG="hotend at temp"

  SET_GCODE_OFFSET Z={z_hot_offset}

  # ---- 8. prime + wipe + purge line ----
  _PS_BUCKET_PRIME
  dynamic_clean WIPES=1
  _PS_PURGE_LINE

  _PS_MARK MSG="ready - printing"
  STATUS_PRINTING


######################################################################
##  Helpers
######################################################################

[gcode_macro _PS_MARK]
## Elapsed-time logger: RESET=1 starts the clock, MSG="text" prints elapsed
variable_t0: 0.0
gcode:
  {% set now = printer.toolhead.estimated_print_time %}
  {% if params.RESET|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_PS_MARK VARIABLE=t0 VALUE={now}
    M118 PS: start
  {% else %}
    M118 PS: {params.MSG|default("mark")} @ {"%.0f"|format(now - t0)}s
  {% endif %}

[gcode_macro _PS_BUCKET_PRIME]
## Prime over the bucket. Relative E, small retract, no long dwells.
variable_x: 120
variable_y: 255
variable_z: 10
variable_length: 15
gcode:
  STATUS_CLEANING
  G90
  G0 X{x} Y{y} F6000
  G0 Z{z} F1500
  M83
  G1 E{length} F300          # 5 mm/s
  G1 E-0.5 F1800             # small retract to stop ooze
  G4 P1000

[gcode_macro _PS_PURGE_LINE]
## Purge line along the left edge, written for RELATIVE extrusion.
## ~0.6 mm wide at 0.3 mm tall over 180 mm ~= 14 mm filament per pass.
gcode:
  G90
  M83
  G0 Z2 F3000
  G0 X1 Y20 F6000
  G0 Z0.3 F1500
  G1 E0.5 F1800              # undo the bucket retract
  G1 Y200 E14 F1500          # line 1
  G0 X1.6 F3000
  G1 Y20 E10 F1500           # line 2 (thinner, wipes the first)
  G1 E-0.5 F1800
  G0 Z2 F3000
  G0 X5 Y20 F6000            # step off to avoid dragging the blob
  G92 E0


######################################################################
##  PRINT_END  (same as before except 2 mm retract instead of 10)
######################################################################

[gcode_macro PRINT_END]
gcode:
  M400                           ; wait for buffer to clear
  G92 E0
  G91
  G1 E-2.0 F2400                 ; modest retract (was 10 mm)
  G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle off the part
  G90
  CLEAN_NOZZLE
  TURN_OFF_HEATERS
  M107                           ; part fan off
  {% if 'gcode_macro _EXHAUST' in printer %}
    _EXHAUST MODE=end              ; clear fumes for a few minutes, then off
  {% endif %}
  G0 X125 Y250 Z50 F3600         ; park nozzle at rear
  STATUS_READY
  BED_MESH_CLEAR
