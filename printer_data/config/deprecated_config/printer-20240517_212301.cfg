#Beta config file for Voron 2.4 250mm
#Firmware for USART2 communication between rPi and Octopus

######################################################################
##  Basic MCU / Printer parameters
######################################################################

[include mainsail.cfg]
[include led_macros.cfg]
[include case_leds.cfg]
[include sb_leds_rbarf.cfg]
#[include stealthburner_leds.cfg]
[include test_macros.cfg]

[mcu]
serial: /dev/ttyAMA0
restart_method: command

##-------------------------

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

######################################################################
##  A/B DRIVE STEPPERS
######################################################################

##  X Stepper on MOTOR0 (B Drive)

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

position_min: -2
position_max: 249

endstop_pin: PG6
position_endstop: 248

homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##-------------------------
##  X Stepper Driver

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------
##--------------------------------------------------------------------

##  Y Stepper on MOTOR1 (A Drive)

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15

rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

position_min: 0
position_max: 255

endstop_pin: PG9
position_endstop: 254

homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##-------------------------
##  Y Stepper Driver

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

######################################################################
##  Z DRIVE STEPPERS
######################################################################

##  Z0 Stepper on MOTOR2 (Front Left)

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

position_min: -5
position_max: 240

##  Z Endstop and Homing (applicable for all Z drive)
endstop_pin: PG10
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: 1

homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3

##-------------------------
##  Z0 Stepper Driver

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------
##--------------------------------------------------------------------

##  Z1 Stepper on MOTOR3 (Rear Left)

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##-------------------------
##  Z1 Stepper Driver

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------
##--------------------------------------------------------------------

##  Z2 Stepper on MOTOR4 (Rear Right)

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##-------------------------
##  Z2 Stepper Driver

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------
##--------------------------------------------------------------------

##  Z3 Stepper on MOTOR5 (Front Right)

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1

rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##-------------------------
##  Z3 Stepper Driver

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

######################################################################
##  EXTRUDER
######################################################################

##  E0 on MOTOR6

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4

#[stock] rotation_distance: 22.6789511   #### UPDATE AFTER CALIBRATING 100mm FILAMENT FEED
rotation_distance: 22.1
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.75

heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: -200
max_temp: 270
max_power: 1.0
min_extrude_temp: 10

#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721

pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

##-------------------------
##  E0 Stepper Driver

[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

######################################################################
##  BED HEATER
######################################################################

#   Bed Heater

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF3

max_power: 0.6
min_temp: 0
max_temp: 120

#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

######################################################################
##  ADDITIONAL SENSORS
######################################################################

##  Debug Temp probe #1

[temperature_sensor debug_temp_probe_1]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: -200
max_temp: 300
#   See the "extruder" section for the definition of the above
#   parameters.
gcode_id: A
#   See the "heater_generic" section for the definition of this
#   parameter.

##--------------------------------------------------------------------
##  Debug Temp probe #2

#[temperature_sensor debug_temp_probe_2]
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PF6
#min_temp: -200
#max_temp: 300
#   See the "extruder" section for the definition of the above
#   parameters.
#gcode_id: B
#   See the "heater_generic" section for the definition of this
#   parameter.




######################################################################
##  PROBE
######################################################################
##	Inductive Probe Notes
    ##	This probe is not used for Z height, only Quad Gantry Leveling

    # Select the probe port by type:
    ## For the PROBE port; use this with the original OMRON sensor.
    # pin: ~!PB7
    ## For the spare endstop port; use this with the Fotek PL-05N (or generic) inductive probe
    # pin: ^PG11
    ## For Octopus Pro Probe port; NPN and PNP proximity switch types can be set by jumper
    # pin: ^PC5

##  Probe

[probe]
pin: PG15
x_offset: 0
y_offset: 25.0
z_offset: 0
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3


######################################################################
##  FANS
######################################################################

##--------------------------------------------------------------------
##	Part Cooling Fan on CNC_FAN0

[fan]
pin: PA8
kick_start_time: 0.5
off_below: 0.10

##--------------------------------------------------------------------
##	Hotend Fan on CNC_FAN1

[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

##--------------------------------------------------------------------
##  Controller Fan on CNC_FAN2

[heater_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0

##--------------------------------------------------------------------
##  Exhaust Filter Fan on CNC_FAN3

[heater_fan exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0

######################################################################
##  HOMING AND GANTRY LEVELING
######################################################################

##  Idle Timeout



##-------------------------
##  Safe Z Home

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
home_xy_position: 181.5,255
speed:100
z_hop:10

##-------------------------
##  Quad Gantry Leveling 

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

gantry_corners:
	-60,-10
	310, 320
#	Probe points
points:
	50,25
	50,175
	200,175
	200,25

speed: 250
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

######################################################################
##  EXP1 / EXP2 PINS (Expansion / Display)
######################################################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

######################################################################
##  DISPLAYS 
######################################################################

##-------------------------
##  Mini12864 LCD

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

######################################################################
##  LEDs
######################################################################

##  Chamber LEDS - uncommment if set up
    #[output_pin caselight]
    # Chamber Lighting - HE1 Connector (Optional)
    #pin: PA3
    #pwm:true
    #shutdown_value: 0
    #value:1
    #cycle_time: 0.01

# DK -- LED's initialized at the top of this file. These commands could be moved here to keep the logical flow.
# [include led_macros.cfg]
# [include case_leds.cfg]
# [include sb_leds_rbarf.cfg]

# DK -- 'btt_mini12864' isn't a very friendly name
[neopixel btt_mini12864]
##	To control Neopixel RGB in mini12864 display
pin: EXP1_6
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

##	Set RGB values on boot up for each Neopixel. 
##	Index 1 = display, Index 2 and 3 = Knob

# DK - 
#   Why not send the command (TRANSMIT=1) at the end of this sequence? 
#   Why white, red, red??

[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3 

######################################################################
##  BED MESH
######################################################################

[bed_mesh]
speed: 150
horizontal_move_z: 5

mesh_min: 40, 40
mesh_max: 210,210

fade_start: 0.6
fade_end: 10.0
probe_count: 15,15
algorithm: bicubic

