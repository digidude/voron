[gcode_macro save_led]
variable_red: 0
variable_green: 0
variable_blue: 0

gcode:
  SET_GCODE_VARIABLE MACRO=save_led VARIABLE=red VALUE={printer['neopixel case_lighting'].color_data[0][0]|float}
  SET_GCODE_VARIABLE MACRO=save_led VARIABLE=green VALUE={printer['neopixel case_lighting'].color_data[0][1]|float}
  SET_GCODE_VARIABLE MACRO=save_led VARIABLE=blue VALUE={printer['neopixel case_lighting'].color_data[0][2]|float}

[gcode_macro restore_led]

gcode:
  SET_LED LED="case_lighting" RED={printer['gcode_macro save_led'].red} GREEN={printer['gcode_macro save_led'].green} BLUE={printer['gcode_macro save_led'].blue}  SYNC=0 TRANSMIT=1