######################################################################
##  KlipperScreen.conf  (config_v2, 2026-10-04)
##  Your own KlipperScreen settings go ABOVE the "#~#" line at the bottom;
##  everything below that line is written by KlipperScreen itself.
##  Menus here are ADDED to KlipperScreen's built-in ones.
##  Docs: KlipperScreen/docs/Configuration.md (## Menu)
######################################################################

##--------------------------------------------------------------------
##  View Variables -- idle main menu
##  Runs VIEW_VARIABLES (macros/debug.cfg). Output goes to the Console,
##  so the last button opens it.
##--------------------------------------------------------------------
[menu __main view_vars]
name: View Variables
icon: info
enable: {{ 'VIEW_VARIABLES' in printer.gcode_macros.list }}

[menu __main view_vars tunables]
name: My Settings
icon: fine-tune
method: printer.gcode.script
params: {"script":"VIEW_VARIABLES SHOW=tunables"}

[menu __main view_vars state]
name: Printer State
icon: printer
method: printer.gcode.script
params: {"script":"VIEW_VARIABLES SHOW=state"}

[menu __main view_vars console]
name: Open Console
icon: console
panel: console

##--------------------------------------------------------------------
##  View Variables -- in-print menu (from the print status screen)
##  Same buttons; handy for "why did it do that?" mid-print.
##--------------------------------------------------------------------
[menu __print view_vars]
name: View Variables
icon: info
enable: {{ 'VIEW_VARIABLES' in printer.gcode_macros.list }}

[menu __print view_vars tunables]
name: My Settings
icon: fine-tune
method: printer.gcode.script
params: {"script":"VIEW_VARIABLES SHOW=tunables"}

[menu __print view_vars state]
name: Printer State
icon: printer
method: printer.gcode.script
params: {"script":"VIEW_VARIABLES SHOW=state"}

[menu __print view_vars console]
name: Open Console
icon: console
panel: console

