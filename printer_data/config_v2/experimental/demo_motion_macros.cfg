######################################################################
##  experimental/demo_motion_macros.cfg  (unchanged from your old file)
##  Every .cfg in experimental/ is auto-included by printer.cfg. Rename a
##  file to .cfg.disabled to switch it off without deleting it.
##
##  FAST_MOTION_DEMO LOOPS=5   - squares at 14000 mm/min... note that's
##  capped by max_velocity (300 mm/s = 18000 mm/min) anyway.
######################################################################

[gcode_macro fast_motion_demo]
variable_speed: 14000
variable_zheight: 10
gcode:
  {% set loops = params.LOOPS|default(5)|int %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  {% for pass in range(1, (loops+1)) %}
    G1 X10 Y10 Z{zheight} F{speed * 60}
    G1 X10 Y240 Z{zheight} F{speed * 60}
    G1 X240 Y240 Z{zheight} F{speed * 60}
    G1 X240 Y10 Z{zheight} F{speed * 60}
    G1 X10 Y10 Z{zheight} F{speed * 60}
    G1 X75 Y75 Z{zheight} F{speed * 60}
    G1 X175 Y75 Z{zheight} F{speed * 60}
    G1 X175 Y175 Z{zheight} F{speed * 60}
    G1 X75 Y175 Z{zheight} F{speed * 60}
    G1 X75 Y75 Z{zheight} F{speed * 60}
    G1 X100 Y100 Z{zheight} F{speed * 60}
    G1 X100 Y150 Z{zheight} F{speed * 60}
    G1 X150 Y150 Z{zheight} F{speed * 60}
    G1 X150 Y100 Z{zheight} F{speed * 60}
    G1 X100 Y100 Z{zheight} F{speed * 60}
  {% endfor %}
