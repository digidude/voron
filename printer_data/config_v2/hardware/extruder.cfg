######################################################################
##  hardware/extruder.cfg  --  Clockwork 2 extruder + hotend
##
##  The [extruder] section covers BOTH the filament motor and the hotend
##  heater/thermistor - Klipper treats them as one object.
##
##  PID values (control/pid_kp/ki/kd) are NOT here on purpose: they live
##  in the SAVE_CONFIG block at the bottom of printer.cfg, written by
##  PID_CALIBRATE. Re-run with PID_EXTRUDER (macros/calibration.cfg)
##  if you change the heater, thermistor, sock or part-fan duct.
######################################################################

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4                 # Octopus MOTOR6

## --- Filament feed calibration ---------------------------------------
## Clockwork 2 stock value is 22.6789511 with a 50:10 gear ratio. Yours
## was calibrated to 22.1 (the "extrude 100 mm, measure" test).
## Smaller number = more filament per commanded mm.
rotation_distance: 22.1
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75

## --- Heater / thermistor ---------------------------------------------
heater_pin: PA3                  # Octopus HE0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4                  # Octopus T0
max_power: 1.0
max_temp: 270                    # Klipper shuts down above this. Fine for ABS/ASA at
                                 #   240-260. Only raise it if your hotend is all-metal
                                 #   and you need >260C (some ASA profiles go to 270).

## FIXED (safety): was -200. If the thermistor wire breaks, the reading
## plunges; a sane min_temp makes Klipper shut the heater off instead of
## running it at full power "trying to warm a -200C nozzle".
min_temp: 0

## FIXED (safety): was 0, which disables Klipper's cold-extrusion
## protection. 170C blocks grinding/stripping filament against a cold
## nozzle but still allows all normal printing.
min_extrude_temp: 170

## NICE-TO-HAVE: lets LOAD/UNLOAD_FILAMENT move more than the default
## 50 mm in one command.
max_extrude_only_distance: 120

## --- Pressure advance --------------------------------------------------
## Compensates for pressure building/releasing in the melt zone (sharper
## corners, no blobs). 0.04 was your value; tune per filament in Orca
## (Calibration > Pressure Advance) - Orca's per-filament value overrides
## this.
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040


[tmc2209 extruder]
uart_pin: PE1
interpolate: false               # Voron reference: off for the extruder
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0


[verify_heater extruder]
## Klipper's thermal-runaway guard. These are the Klipper defaults,
## written out so you can see them: if the heater is on but temperature
## doesn't rise by 2C within 20 s, or drifts > 15C below target for too
## long, Klipper shuts down. Don't loosen these to "fix" errors - an
## error here means a real hardware problem (loose thermistor, bad
## heater crimp, sock missing + fan blasting).
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2
