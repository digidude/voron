######################################################################
##  hardware/beacon.cfg  --  Beacon probe + gantry levelling + bed mesh
##
##  HOW BEACON WORKS (short version)
##  * Beacon is an eddy-current sensor: a coil under the toolhead "feels"
##    the distance to the metal bed without touching it ("proximity").
##    It's fast - it can scan the whole bed while moving.
##  * Proximity readings drift with temperature, so Beacon keeps a
##    "model" that maps coil readings to mm. CALIBRATE builds that model.
##  * "Contact" mode (RevH) instead lowers the NOZZLE until it actually
##    touches the bed, sensed by Beacon's accelerometer. That gives a true
##    nozzle-to-bed zero -> no manual Z offset needed.
##  * Typical flow (Beacon docs): contact-home + calibrate on a hot bed ->
##    QGL (proximity) -> mesh (proximity scan) -> wipe nozzle -> final
##    contact Z home -> heat to print temp -> small offset for nozzle
##    thermal expansion. That's what PRINT_START does.
##
##  Docs: https://docs.beacon3d.com/contact/
######################################################################

[beacon]
## Unique USB id of YOUR Beacon (unchanged from your config).
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_671857085154364134202020FF152211-if00

## Where the Beacon coil is relative to the nozzle (mm).
## Stealthburner Beacon mount: directly behind the nozzle -> X 0, Y +25.
x_offset: 0
y_offset: 25

## --- Mesh scanning ---------------------------------------------------
mesh_main_direction: x           # scan in rows along X
mesh_runs: 1                     # 2 = scan twice and average (slower, a bit smoother)

## --- Homing ------------------------------------------------------------
## Beacon replaces [safe_z_home]: it moves to this XY before homing Z.
home_xy_position: 125, 125       # bed centre
home_z_hop: 5                    # lift before moving XY (mm)
home_z_hop_speed: 30
home_xy_move_speed: 300

home_method: contact             # first Z home of a session = nozzle touch
home_method_when_homed: proximity  # later plain G28's use the (fast) coil
home_autocalibrate: unhomed      # first contact home also builds the model

## NEW (explicit): Beacon refuses to contact-home with a nozzle hotter than
## this (hot nozzles ooze and can damage PEI). 180 is the Beacon default;
## PRINT_START contact-homes at 150.
contact_max_hotend_temperature: 180


######################################################################
##  QUAD GANTRY LEVEL (QGL)
##  Measures the 4 corners and drives the 4 Z motors until the gantry is
##  parallel to the bed. Needed after motors have been off (they can
##  drift), so PRINT_START runs it once and skips it on retries.
######################################################################
[quad_gantry_level]
## gantry_corners: approximate XY of the gantry pivot points, OUTSIDE the
## bed. Voron reference values for a 250 mm build.
gantry_corners:
    -60,-10
    310, 320
## points: where the NOZZLE goes to probe (Beacon sits 25 mm behind it,
## so it actually measures at Y+25). Voron reference values for 250 mm.
points:
    50,25
    50,175
    200,175
    200,25
speed: 300                       # CHANGED 400 -> 300 (= max_velocity; 400 was silently clamped)
horizontal_move_z: 2             # Beacon is happy probing from 2 mm
retries: 5
retry_tolerance: 0.0075          # mm. QGL repeats until all corners within this
max_adjust: 10


######################################################################
##  BED MESH
##  A height map of the bed, so Z follows small dips/bumps while printing
##  the first layers. Your bed is very flat (your old 31x31 mesh spans
##  about 0.05 mm total) - the mesh is a refinement, not a crutch.
######################################################################
[bed_mesh]
speed: 300
horizontal_move_z: 2
mesh_min: 25, 25                 # these are NOZZLE coordinates
mesh_max: 225, 225
## CHANGED 9,9 -> 15,15. Beacon *scans* (doesn't stop at each point), so
## more points costs very little time. ADAPTIVE=1 only scans the area
## your parts cover and scales the point count down automatically.
probe_count: 15, 15
algorithm: bicubic
## Mesh correction fades out between these heights; above 10 mm the
## printer trusts the gantry (prints don't need the mesh up high).
fade_start: 0.6
fade_end: 10.0
## Mesh value at this XY is treated as "zero". Matches the spot Beacon
## contact-homes at, so mesh and Z home agree.
zero_reference_position: 125, 125
## Extra margin (mm) around the parts when ADAPTIVE=1.
adaptive_margin: 5


######################################################################
##  RESONANCE TESTER (input shaper)
##  NICE-TO-HAVE (enabled): Beacon RevH has a built-in accelerometer, so
##  SHAPER_CALIBRATE works with no extra hardware. Your old adxl.cfg used
##  a separate RP2040 + ADXL345 on its own [mcu]; that's dropped here
##  because Klipper won't start if that board is unplugged. Its section
##  is kept in experimental/adxl_rp2040.cfg.disabled if you want it back.
######################################################################
[resonance_tester]
accel_chip: beacon
probe_points:
    125, 125, 20
