######################################################################
##  hardware/motors.cfg  --  A/B (X/Y) and Z steppers + TMC2209 drivers
##
##  QUICK PRIMER
##  * A Voron 2.4 is CoreXY: two motors (A and B) move the toolhead in X
##    and Y together. Klipper still calls them stepper_x / stepper_y.
##  * Four Z motors (one per gantry corner) lift the gantry. QUAD_GANTRY_
##    LEVEL moves them independently to make the gantry flat.
##  * rotation_distance = mm of travel per motor revolution.
##      X/Y: 20-tooth pulley x 2 mm belt pitch = 40.
##      Z  : 40 with gear_ratio 80:16 (the 2.4's Z drive reduction).
##  * microsteps 16 + interpolate: the driver internally smooths to 256.
##  * run_current = amps while moving; hold_current = amps when idle.
##    0.8 A suits the stock LDO 2.0 A motors (Voron reference value).
##  * stealthchop_threshold: 0 = always "SpreadCycle" (strong, a little
##    louder). Recommended for X/Y/Z on a Voron.
##  * sense_resistor 0.110 is correct for the Octopus' TMC2209 modules.
##
##  All pins / currents / positions below are YOUR previous values.
######################################################################


##====================================================================
##  X  -- B motor, Octopus MOTOR0
##====================================================================
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200     # 400 if you ever fit 0.9-degree motors
endstop_pin: PG6                 # X endstop (switch on the XY joint)
position_min: -2
position_endstop: 248            # X homes to the MAX side (right)
position_max: 249
homing_speed: 100                # don't exceed 100 on a 2.4
homing_retract_dist: 2
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
hold_current: 0.7                # (Klipper now suggests omitting hold_current; kept as you had it)
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Y  -- A motor, Octopus MOTOR1
##====================================================================
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: PG9                 # Y endstop (switch on the gantry)
position_min: 0
position_endstop: 254            # Y homes to the MAX side (rear)
position_max: 255
homing_speed: 100
homing_retract_dist: 2
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z0 -- front left, Octopus MOTOR2
##  Only [stepper_z] gets the endstop/limit settings; Z1-Z3 follow it.
##====================================================================
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
## Beacon acts as the Z endstop ("virtual endstop"). There is no
## physical Z switch, so there's no position_endstop here - Beacon
## supplies it (and Klipper keeps a stale copy in SAVE_CONFIG, harmless).
endstop_pin: probe:z_virtual_endstop
position_min: -2                 # lets babystepping/negative offsets work
position_max: 240
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 0           # MUST be 0 with Beacon

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8                # Z holds at full current so the gantry can't sag
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z1 -- rear left, Octopus MOTOR3
##====================================================================
[stepper_z1]
step_pin: PG4
dir_pin: !PC1                    # "!" inverts direction (Z1/Z3 are mirrored)
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z2 -- rear right, Octopus MOTOR4
##====================================================================
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##====================================================================
##  Z3 -- front right, Octopus MOTOR5
##====================================================================
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
