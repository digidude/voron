######################################################################
##  hardware/bed.cfg  --  heated bed (AC heater via SSR)
##
##  PID values are in the SAVE_CONFIG block of printer.cfg.
##  Re-tune with PID_BED (macros/calibration.cfg).
######################################################################

[heater_bed]
heater_pin: PA2                  # Octopus BED_OUT -> drives the SSR
sensor_type: Generic 3950
sensor_pin: PF3                  # Octopus TB

## max_power caps the heater's duty cycle. The Voron reference uses 0.6
## for a 250 mm bed so the heater pad doesn't overheat the aluminium
## plate locally (Voron's rule of thumb: ~0.4 W per cm^2).
## This is also WHY the bed takes a while to heat. Only raise it if you
## know your heater's wattage and the SSR's rating allow it.
max_power: 0.6

## FIXED (safety): was -250 (see the extruder comment for why).
min_temp: 0
max_temp: 120


[verify_heater heater_bed]
## Beds heat slowly, so Klipper's default check_gain_time for the bed is
## 60 s. Written out here for visibility only.
check_gain_time: 60
