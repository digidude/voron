######################################################################
##  hardware/fans.cfg
##
##  Klipper fan types used here:
##   [fan]              - THE part-cooling fan; the slicer drives it with M106/M107.
##   [heater_fan x]     - turns on automatically when a heater is above a temp.
##   [controller_fan x] - turns on whenever stepper motors are enabled.
##   [fan_generic x]    - only changes when a macro/you say so (SET_FAN_SPEED).
##
##  kick_start_time: spins the fan at full power briefly so it reliably
##  starts from standstill, then drops to the requested speed.
######################################################################


##--------------------------------------------------------------------
##  Part cooling fan (Stealthburner blower) -- Octopus FAN0
##--------------------------------------------------------------------
[fan]
pin: PA8
kick_start_time: 0.5
## Speeds below 10% are treated as off (blowers stall/whine down there).
off_below: 0.10


##--------------------------------------------------------------------
##  Hotend fan -- Octopus FAN1
##  Cools the heatsink so filament only melts where it should. Must be
##  on whenever the hotend is warm, hence heater_fan.
##--------------------------------------------------------------------
[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0


##--------------------------------------------------------------------
##  Electronics bay fan -- Octopus FAN2
##  CHANGED: was a heater_fan tied to the BED (>45C), so the stepper
##  drivers and Pi got no airflow on cold-bed jobs or while homing.
##  controller_fan = on whenever motors are enabled (Voron reference
##  setup) plus whenever the bed or hotend heater is on.
##--------------------------------------------------------------------
[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed, extruder
idle_timeout: 60                 # keep running 60 s after everything goes idle


##--------------------------------------------------------------------
##  Exhaust fan -- Octopus FAN3
##  CHANGED: was a heater_fan running 100% whenever bed > 60C, which
##  pulled heat out of the chamber during ABS/ASA prints (a top suspect
##  for corners lifting). Now macro-controlled - see _EXHAUST below.
##  Manual control any time:  SET_FAN_SPEED FAN=exhaust_fan SPEED=0.5
##--------------------------------------------------------------------
[fan_generic exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5


##--------------------------------------------------------------------
##  Nevermore carbon filter -- Octopus FAN4
##  Recirculates chamber air through carbon (keeps the heat in, scrubs
##  fumes). Fine as a heater_fan: on whenever the bed is warm.
##--------------------------------------------------------------------
[heater_fan nevermore_fan]
pin: PD14
heater: heater_bed
heater_temp: 45.0
fan_speed: 1.0


######################################################################
##  _EXHAUST -- exhaust fan policy (called from PRINT_START / PRINT_END)
##
##   MODE=print BED=<temp> : ABS/ASA (bed >= 90C) -> OFF while printing
##                           PLA/PETG             -> 60% (keeps chamber cool;
##                                                   PLA hates a hot chamber)
##   MODE=end              : 100% for 5 min to clear fumes, then off
##   MODE=off              : off now
##  Tweak the variable_ lines to change the policy.
######################################################################
[gcode_macro _EXHAUST]
variable_hot_bed_threshold: 90
variable_speed_hot: 0.0
variable_speed_cool: 0.6
variable_end_speed: 1.0
variable_end_minutes: 5
gcode:
  {% set mode = params.MODE|default("print")|lower %}
  {% if mode == "print" %}
    {% set bed = params.BED|default(0)|int %}
    {% set s = speed_hot if bed >= hot_bed_threshold else speed_cool %}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED={s}
  {% elif mode == "end" %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED={end_speed}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION={end_minutes * 60}
  {% else %}
    UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
  {% endif %}

## A [delayed_gcode] runs once, N seconds after something schedules it
## with UPDATE_DELAYED_GCODE (DURATION=0 cancels it).
[delayed_gcode _EXHAUST_OFF]
gcode:
  SET_FAN_SPEED FAN=exhaust_fan SPEED=0
