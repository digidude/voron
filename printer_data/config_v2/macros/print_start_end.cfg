######################################################################
##  macros/print_start_end.cfg  --  PRINT_START / PRINT_END
##
##  MACRO PRIMER
##  * A [gcode_macro NAME] defines a new command. Its "gcode:" lines run
##    when you (or the slicer) send NAME.
##  * {...} and {% ... %} are Jinja2 templates. IMPORTANT: Klipper fills
##    in ALL the template parts once, when the macro STARTS, then runs the
##    resulting lines. So {% if %} decisions use the printer's state at
##    the start. To read a value later (e.g. after homing), call another
##    macro - it gets evaluated when it runs.
##  * variable_xxx: lines are settings you can read as {xxx} inside the
##    macro, from other macros as printer["gcode_macro NAME"].xxx, and
##    change live with SET_GCODE_VARIABLE.
##  * params.XYZ reads "NAME XYZ=123" arguments.
##
##  ORCA "Machine start G-code" (unchanged from what you have now):
##     M104 S0
##     M140 S0
##     PRINT_START HOTEND=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]
##
##  Optional arguments:  SOAK=<minutes>  FULL=1  MESH=0  CHAMBER=<C>
##
##  The console prints "PS: <step> @ <seconds>" so you can see where the
##  time goes and compare experiments.
######################################################################

[gcode_macro PRINT_START]
description: Heat, level, mesh, prime. Fast-path on retries.
## ---- Tunables -------------------------------------------------------
## Nozzle temp for Beacon contact homing (Beacon max is 180). Hot enough
## to soften stuck-on ooze so the wipe cleans it; cool enough not to drip.
variable_contact_temp: 150
## The nozzle grows slightly longer as it heats from contact_temp to print
## temp, pushing it closer to the bed. A small POSITIVE offset lifts it
## back. Beacon docs suggest starting around 0.06; you were using 0.04.
## TUNE THIS: print a first-layer test, adjust live with Mainsail's
## Z babystep buttons until the layer looks right, then add the babystep
## amount to this number.
variable_z_hot_offset: 0.04
## Bed temps at/above this are treated as ABS/ASA (needs a heat soak).
variable_hot_bed_threshold: 90
## Fixed soak time (minutes) for ABS/ASA when no chamber sensor exists.
variable_auto_soak_min: 10
## If you add [temperature_sensor chamber] (see hardware/sensors.cfg),
## PRINT_START waits for this chamber temp instead of the fixed soak.
## 0 = don't use. 40-45C is a good target for ASA/ABS on a 250 V2.4.
variable_chamber_target: 0
gcode:
  ## ---- Read arguments (with safe defaults) ---------------------------
  {% set BED     = params.BED|default(100)|int %}
  {% set HOTEND  = params.HOTEND|default(250)|int %}
  {% set FULL    = params.FULL|default(0)|int %}
  {% set MESH    = params.MESH|default(1)|int %}
  {% set CHAMBER = params.CHAMBER|default(chamber_target)|int %}
  {% set has_chamber = 'temperature_sensor chamber' in printer %}

  ## ---- Decide what can be skipped --------------------------------------
  ## A "retry" = the printer is still homed, still levelled, and the bed
  ## is within 15C of target (i.e. you just cancelled a failed attempt).
  {% set homed   = "xyz" in printer.toolhead.homed_axes %}
  {% set leveled = printer.quad_gantry_level.applied %}
  {% set bed_hot = printer.heater_bed.temperature >= BED - 15 %}
  {% set retry   = homed and leveled and bed_hot and FULL == 0 %}

  {% if params.SOAK is defined %}
    {% set SOAK = params.SOAK|int %}
  {% elif BED >= hot_bed_threshold and not retry and not (has_chamber and CHAMBER > 0) %}
    {% set SOAK = auto_soak_min %}
  {% else %}
    {% set SOAK = 0 %}
  {% endif %}

  _PS_MARK RESET=1
  {% if retry %}
    M118 PS: RETRY mode - skipping home / QGL / soak  (send PRINT_START ... FULL=1 to force)
  {% endif %}

  ## ---- 0. Clean slate ----------------------------------------------------
  BED_MESH_CLEAR                       # old mesh off until we make a new one
  SET_GCODE_OFFSET Z=0                 # clear any babystep / old offset
  G90                                  # absolute XYZ positioning
  M83                                  # relative extrusion (matches Orca)
  _KEEP_HOT_ARM BED={BED}              # cancel any keep-hot shut-off timer
  _EXHAUST MODE=print BED={BED}        # exhaust OFF for ABS/ASA, 60% for PLA

  ## ---- 1. Start heating everything at once ------------------------------
  STATUS_HEATING
  M140 S{BED}                          # bed: set, don't wait yet
  M104 S{contact_temp}                 # nozzle: contact temp, don't wait

  ## ---- 2. Home while the bed heats (skipped on retry) --------------------
  {% if not homed or FULL == 1 %}
    ## Beacon refuses to contact-home with a hot nozzle; after a cancel
    ## the nozzle may still be at print temp, so wait for it to cool.
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={contact_temp + 10}
    STATUS_HOMING
    G28                                # contact home (+ quick calibrate, bed still cold)
    _PS_MARK MSG="homed"
  {% endif %}

  ## Park low over bed centre: toolhead warms with the chamber, nozzle
  ## isn't dripping onto the brush/bucket area.
  G0 X125 Y125 Z5 F6000

  ## ---- 3. Bed to temp, then soak ----------------------------------------
  STATUS_HEATING
  M190 S{BED}                          # wait for bed
  _PS_MARK MSG="bed at temp"
  {% if has_chamber and CHAMBER > 0 and not retry %}
    M118 PS: waiting for chamber >= {CHAMBER}C
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER}
    _PS_MARK MSG="chamber at temp"
  {% elif SOAK > 0 %}
    ## Why soak: the bed surface, frame and gantry keep expanding for many
    ## minutes after the bed thermistor says "done". Levelling/meshing a
    ## still-moving machine = first layer that's wrong by the time it prints.
    M118 PS: heat soak {SOAK} min  (skip with SOAK=0)
    {% for m in range(SOAK) %}
      M118 PS: soak - {SOAK - m} min left
      G4 P60000                        # wait 60 s
    {% endfor %}
    _PS_MARK MSG="soak done"
  {% endif %}

  ## ---- 4. Beacon calibrate on the HOT bed, then QGL (first run only) -----
  ## Beacon's proximity model is temperature-sensitive; the G28 above
  ## calibrated on a cold bed. Beacon docs: CALIBRATE=1 after heat soak.
  {% if not leveled or FULL == 1 %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={contact_temp - 10} MAXIMUM={contact_temp + 10}
    STATUS_CALIBRATING_Z
    G28 Z METHOD=CONTACT CALIBRATE=1
    _PS_MARK MSG="beacon calibrated (hot)"
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    _PS_MARK MSG="QGL done"
  {% endif %}

  ## ---- 5. Clean nozzle, then the Z zero that matters -----------------------
  ## Any blob on the nozzle = wrong Z. Wipe first, then touch.
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={contact_temp - 10} MAXIMUM={contact_temp + 10}
  CLEAN_NOZZLE WIPES=2
  STATUS_CALIBRATING_Z
  G28 Z METHOD=CONTACT CALIBRATE=0
  _PS_MARK MSG="contact Z"

  ## ---- 6. Adaptive mesh (Beacon proximity scan, only where parts are) -----
  {% if MESH == 1 %}
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1
    _PS_MARK MSG="mesh done"
  {% endif %}

  ## ---- 7. Final nozzle heat, parked over the purge bucket -----------------
  STATUS_HEATING
  G0 Z10 F1500
  _BUCKET_MOVE
  M109 S{HOTEND}
  _PS_MARK MSG="hotend at temp"

  ## Compensate nozzle thermal expansion (see variable_z_hot_offset).
  SET_GCODE_OFFSET Z={z_hot_offset}

  ## ---- 8. Prime, wipe, purge line, go -------------------------------------
  BUCKET_PRIME
  CLEAN_NOZZLE WIPES=1
  PURGE_LINE
  _PS_MARK MSG="ready - printing"
  STATUS_PRINTING


######################################################################
##  PRINT_END
######################################################################
[gcode_macro PRINT_END]
description: Retract, lift clear of the part, wipe, park, cool down.
gcode:
  ## Figure out a safe park height NOW (template time): at least 10 mm
  ## above the finished part, at least 50 mm, never above the Z limit.
  ## (Your old macro moved to absolute Z50, which would drive the nozzle
  ## DOWN into any part taller than 50 mm.)
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set park_z = [[cur_z + 10, 50]|max, max_z - 5]|min %}

  M400                                 # finish all queued moves
  M83
  G1 E-2 F2400                         # small retract (was 10 mm - risks heat creep/jams)
  G91
  G0 Z2 F3000                          # lift off the part
  G90
  G0 Z{park_z} F3000                   # clear the part before any XY travel
  ## CHANGED: no end-of-print brush wipe. The brush sits at Z~1, so the
  ## nozzle would have to drop back down to bed level and travel past the
  ## finished part to reach it. PRINT_START wipes before every print anyway.
  TURN_OFF_HEATERS
  M107                                 # part fan off
  _EXHAUST MODE=end                    # clear fumes for 5 min, then off
  G0 X125 Y250 F6000                   # park rear-centre
  BED_MESH_CLEAR
  STATUS_READY
  ## NOTE: motors are left ON on purpose. That keeps "homed" + QGL valid,
  ## so the next print can skip both. [idle_timeout] turns them off after
  ## 30 min of inactivity.


######################################################################
##  _PS_MARK -- elapsed-time logger used above
##    _PS_MARK RESET=1       start the clock
##    _PS_MARK MSG="text"    print "PS: text @ Ns"
######################################################################
[gcode_macro _PS_MARK]
variable_t0: 0.0
gcode:
  {% set now = printer.toolhead.estimated_print_time %}
  {% if params.RESET|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_PS_MARK VARIABLE=t0 VALUE={now}
    M118 PS: start
  {% else %}
    M118 PS: {params.MSG|default("mark")} @ {"%.0f"|format(now - t0)}s
  {% endif %}
