######################################################################
##  macros/nozzle_clean.cfg  --  brush, purge bucket, purge line
##
##  Replaces your old BUCKET_PURGE, _TEMP_BUCKET_PURGE, _PURGE_CLEAN,
##  CLEAN_NOZZLE, CLEAN_NOZZLE_WIPES, dynamic_clean and _PURGE_LINE
##  (seven macros, several near-duplicates) with three:
##  NOZZLE_CLEAN, NOZZLE_PRIME, NOZZLE_PURGE_LINE (renamed 2026-10-04 so
##  they sort together in Mainsail; NOZZLE_PRIME was BUCKET_PRIME).
##
##  Positions are from your old macros: brush starts at X105 Y253 and is
##  50 mm wide (to X55); bucket at X120 Y255.
##
##  EXTRUSION MODE: everything here uses RELATIVE extrusion (M83) - each
##  "E" is "push this many mm now". Orca is set to relative too. Your old
##  purge line was written for absolute E, which (in relative mode)
##  started the line ~4 mm under-primed and then over-extruded.
######################################################################


##--------------------------------------------------------------------
##  NOZZLE_CLEAN [WIPES=n]
##  Zig-zag the nozzle across the brush. Was "dynamic_clean".
##--------------------------------------------------------------------
[gcode_macro NOZZLE_CLEAN]
description: Wipe the nozzle on the brush. NOZZLE_CLEAN WIPES=n
variable_start_x: 105
variable_start_y: 253
variable_start_z: 1              # brush height - nozzle dips just into the bristles
variable_wipe_dist: -50          # brush width (negative = wipe toward -X)
variable_wipe_spd: 200           # mm/s
variable_raise_distance: 5       # lift after wiping (mm, absolute Z)
gcode:
  {% set wipes = params.WIPES|default(2)|int %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    _STATUS_HOMING
    G28
  {% endif %}
  _STATUS_CLEANING
  G90
  G0 Z{[printer.toolhead.position.z, raise_distance]|max} F1500   # never drag across the bed
  G0 X{start_x} Y{start_y} F12000
  G0 Z{start_z} F1500
  {% for pass in range(wipes) %}
    G0 X{start_x + wipe_dist} F{wipe_spd * 60}
    G0 Y{start_y - 1}         F{wipe_spd * 60}
    G0 X{start_x}             F{wipe_spd * 60}
    G0 Y{start_y + 1}         F{wipe_spd * 60}
  {% endfor %}
  G0 Z{raise_distance} F1500


##--------------------------------------------------------------------
##  _BUCKET_MOVE  --  go stand over the purge bucket
##--------------------------------------------------------------------
[gcode_macro _BUCKET_MOVE]
variable_x: 120
variable_y: 255
variable_z: 10
gcode:
  G90
  G0 Z{[printer.toolhead.position.z, z]|max} F1500
  G0 X{x} Y{y} F12000
  G0 Z{z} F1500


##--------------------------------------------------------------------
##  NOZZLE_PRIME [LENGTH=mm]
##  Push fresh filament through into the bucket so the melt zone is full
##  and at temperature before printing. Small retract to stop ooze.
##  (Old version: 20 mm out, then 10 + 5 mm retract and 11 s of pauses -
##  too much retract at print temp risks heat creep and a starved start.)
##--------------------------------------------------------------------
[gcode_macro NOZZLE_PRIME]
description: Prime the nozzle over the purge bucket. NOZZLE_PRIME LENGTH=15
variable_length: 15
gcode:
  {% set len = params.LENGTH|default(length)|float %}
  {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
    M118 NOZZLE_PRIME: nozzle too cold ({printer.extruder.temperature|round(0)}C) - skipped
  {% else %}
    _STATUS_CLEANING
    _BUCKET_MOVE
    M83
    G1 E{len} F300                 # 5 mm/s - slow so it melts fully
    G1 E-0.5 F1800                 # tiny retract to stop drips
    G4 P1000                       # 1 s to let the ooze settle on the bucket
  {% endif %}


##--------------------------------------------------------------------
##  NOZZLE_PURGE_LINE
##  Two lines along the left edge (X1-1.6, Y20-200). Confirms flow, sticks
##  the first plastic down, and gives the nozzle a clean, primed start.
##  Math: 0.3 mm tall x ~0.6 mm wide x 180 mm long ~= 32 mm^3
##        / 2.405 mm^2 (1.75 mm filament)  ~= 14 mm of filament.
##--------------------------------------------------------------------
[gcode_macro NOZZLE_PURGE_LINE]
description: Draw a purge line at the left edge of the bed
gcode:
  G90
  M83
  G0 Z2 F3000
  G0 X1 Y20 F12000
  G0 Z0.3 F1500
  G1 E0.5 F1800                  # undo the bucket's 0.5 mm retract
  G1 Y200 E14 F1500              # line 1
  G0 X1.6 F3000
  G1 Y20 E10 F1500               # line 2 - thinner, also wipes line 1's tail
  G1 E-0.5 F1800
  G0 Z2 F3000
  G0 X5 Y20 F12000               # step off sideways so the blob doesn't drag
  G92 E0
