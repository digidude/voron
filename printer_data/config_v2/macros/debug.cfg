######################################################################
##  macros/debug.cfg  --  inspect Klipper's internal state
##  (Community macros, unchanged from your community/variables.cfg.)
##
##  _DUMP_VARIABLES NAME=extruder         everything with "extruder" in its name
##  _DUMP_VARIABLES VALUE=true            everything whose value contains "true"
##  _GET_VARIABLE NAME=toolhead.homed_axes    one value (dot path)
##  Leading _ hides them from Mainsail's Macros panel; type them in the
##  console (they still autocomplete there).
##  These are great for learning: every printer.xxx you see in a macro
##  can be explored this way.
######################################################################

[gcode_macro _DUMP_VARIABLES]
description: Console tool - list printer variables. NAME=filter VALUE=filter
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    {% set out = [] %}
    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}

[gcode_macro _GET_VARIABLE]
description: Console tool - show one printer value. NAME=toolhead.homed_axes
gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}
    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}
    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}
    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}
    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}


######################################################################
##  VIEW_VARIABLES  --  one friendly "what is the printer thinking?" button
##  (added 2026-10-04). Read-only: never moves or heats anything, so it's
##  safe to press mid-print.
##
##  In Mainsail, click the small arrow on the button to pick an option.
##  KlipperScreen: main menu (and the in-print menu) -> View Variables.
##  Output appears in the console.
##
##    VIEW_VARIABLES                     = SHOW=tunables
##    VIEW_VARIABLES SHOW=tunables       your settings: PRINT_START, keep-hot,
##                                       brush / bucket positions, exhaust
##    VIEW_VARIABLES SHOW=state          live state: homed? levelled? mesh?
##                                       temps, Z offset, and whether the next
##                                       PRINT_START would take the RETRY path
##    VIEW_VARIABLES NAME=extruder       free search  (-> _DUMP_VARIABLES)
##    VIEW_VARIABLES PATH=toolhead.homed_axes  one value (-> _GET_VARIABLE)
##
##  To change a tunable live (until the next restart):
##    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=z_hot_offset VALUE=0.06
##  To change it permanently, edit the variable_ line in its .cfg file.
######################################################################
[gcode_macro VIEW_VARIABLES]
description: Show settings / live state. SHOW=tunables|state, or NAME= / PATH=
gcode:
  {% set show = params.SHOW|default("tunables")|string|lower %}
  {% set name = params.NAME|default("")|string %}
  {% set path = params.PATH|default("")|string %}
  {% if path != "" %}
    _GET_VARIABLE NAME={path}
  {% elif name != "" %}
    _DUMP_VARIABLES NAME={name}
  {% elif show == "state" %}
    _VIEW_STATE
  {% else %}
    _VIEW_TUNABLES
  {% endif %}


## Prints every variable_ of the macros you're most likely to tune.
## Add a macro name to the list below to include it.
[gcode_macro _VIEW_TUNABLES]
variable_macros: ["PRINT_START", "_KEEP_HOT", "NOZZLE_CLEAN", "NOZZLE_PRIME", "_BUCKET_MOVE", "_EXHAUST"]
gcode:
  {% set out = ["=== TUNABLES (variable_ lines in your macros) ==="] %}
  {% for m in macros %}
    {% set key = "gcode_macro " ~ m %}
    {% if key in printer %}
      {% set dummy = out.append("") %}
      {% set dummy = out.append("[" ~ m ~ "]") %}
      {% for k, v in printer[key].items()|sort %}
        {% set dummy = out.append("  " ~ k ~ " = " ~ v) %}
      {% endfor %}
    {% endif %}
  {% endfor %}
  {% set dummy = out.append("") %}
  {% set dummy = out.append("Change live: SET_GCODE_VARIABLE MACRO=<name> VARIABLE=<var> VALUE=<x>") %}
  {action_respond_info(out|join("\n"))}


## Live state, plus the same "retry?" test PRINT_START uses.
[gcode_macro _VIEW_STATE]
gcode:
  {% set th = printer.toolhead %}
  {% set homed = "xyz" in th.homed_axes %}
  {% set leveled = printer.quad_gantry_level.applied %}
  {% set bed = printer.heater_bed %}
  {% set ext = printer.extruder %}
  {% set last_bed = printer["gcode_macro _KEEP_HOT_ARM"].bed|int %}
  {% set mesh = printer.bed_mesh.profile_name if printer.bed_mesh.profile_name else "none" %}
  {% set out = ["=== PRINTER STATE ==="] %}
  {% set dummy = out.append("Print state:   " ~ printer.print_stats.state) %}
  {% set dummy = out.append("Homed axes:    " ~ (th.homed_axes if th.homed_axes else "none")) %}
  {% set dummy = out.append("QGL applied:   " ~ leveled) %}
  {% set dummy = out.append("Bed mesh:      " ~ mesh) %}
  {% set dummy = out.append("Position:      X%.1f Y%.1f Z%.2f" % (th.position.x, th.position.y, th.position.z)) %}
  {% set dummy = out.append("Z offset:      %.3f  (babystep + z_hot_offset)" % printer.gcode_move.homing_origin.z) %}
  {% set dummy = out.append("Bed:           %.1fC  (target %.0f)" % (bed.temperature, bed.target)) %}
  {% set dummy = out.append("Nozzle:        %.1fC  (target %.0f)" % (ext.temperature, ext.target)) %}
  {% if 'temperature_sensor chamber' in printer %}
    {% set dummy = out.append("Chamber:       %.1fC" % printer['temperature_sensor chamber'].temperature) %}
  {% endif %}
  {% set dummy = out.append("Last print bed: " ~ (last_bed ~ "C" if last_bed > 0 else "none (cleared by COOLDOWN / keep-hot timeout)")) %}
  {% set dummy = out.append("") %}
  {% if last_bed > 0 %}
    {% set bed_ok = bed.temperature >= last_bed - 15 %}
    {% set retry = homed and leveled and bed_ok %}
    {% set dummy = out.append("Next PRINT_START at bed " ~ last_bed ~ "C -> " ~ ("RETRY fast path (skips home/QGL/soak)" if retry else "FULL start")) %}
    {% if not retry %}
      {% set why = [] %}
      {% if not homed %}{% set dummy = why.append("not homed") %}{% endif %}
      {% if not leveled %}{% set dummy = why.append("QGL not applied") %}{% endif %}
      {% if not bed_ok %}{% set dummy = why.append("bed more than 15C below target") %}{% endif %}
      {% set dummy = out.append("  because: " ~ why|join(", ")) %}
    {% endif %}
  {% else %}
    {% set retry = homed and leveled %}
    {% set dummy = out.append("Next PRINT_START: " ~ ("RETRY possible if the bed is within 15C of the new target" if retry else "FULL start (" ~ ("not homed" if not homed else "QGL not applied") ~ ")")) %}
  {% endif %}
  {action_respond_info(out|join("\n"))}
