######################################################################
##  macros/cancel_keep_hot.cfg  --  make a cancelled print retry-ready
##
##  Mainsail's CANCEL_PRINT (from mainsail.cfg) normally: retracts 5 mm,
##  turns all heaters off, leaves the nozzle sitting on the failed part.
##  With this file, a cancel instead:
##    - parks over the purge bucket (X120 Y250)
##    - retracts only 1 mm
##    - turns the bed back on to the last print temp and the nozzle to
##      150C (the contact-homing temp) for 15 minutes, then shuts off
##  Restart the print inside that window and PRINT_START takes its
##  "retry" fast path (no homing, QGL or soak).
##
##  Commands:
##    COOLDOWN                  heaters off now + cancel the timer
##    KEEP_HOT ENABLE=0         disable this behaviour (until restart)
##    KEEP_HOT MINUTES=30       change the window
##
##  CAVEAT: Klipper also calls CANCEL_PRINT on some print errors, so those
##  will keep heat on for the window too. The timer always shuts it off.
######################################################################


## Mainsail reads its options from this macro (see the comments at the top
## of mainsail.cfg for the full list). Anything not set uses the default.
[gcode_macro _CLIENT_VARIABLE]
variable_cancel_retract   : 1.0      ; mm retracted on cancel (default 5)
variable_park_at_cancel   : True     ; move the toolhead away on cancel
variable_park_at_cancel_x : 120.0    ; ... to the purge bucket
variable_park_at_cancel_y : 250.0
variable_user_cancel_macro: "_KEEP_HOT"   ; run after Mainsail turns heaters off
gcode:


## Called by PRINT_START: remember the bed temp, cancel any pending
## shut-off (so a retry isn't killed mid-print by the timer).
[gcode_macro _KEEP_HOT_ARM]
variable_bed: 0
gcode:
  UPDATE_DELAYED_GCODE ID=_KEEP_HOT_OFF DURATION=0
  SET_GCODE_VARIABLE MACRO=_KEEP_HOT_ARM VARIABLE=bed VALUE={params.BED|default(0)|int}


## Called by Mainsail's CANCEL_PRINT, right after it turned heaters off.
[gcode_macro _KEEP_HOT]
variable_enabled: 1
variable_minutes: 15
gcode:
  {% set bed = printer["gcode_macro _KEEP_HOT_ARM"].bed|int %}
  {% set nozzle = printer["gcode_macro PRINT_START"].contact_temp|int %}
  {% if enabled == 1 and bed > 0 %}
    M140 S{bed}
    M104 S{nozzle}
    UPDATE_DELAYED_GCODE ID=_KEEP_HOT_OFF DURATION={minutes * 60}
    M118 KEEP_HOT: bed {bed}C / nozzle {nozzle}C for {minutes} min. Re-start the print to retry, or COOLDOWN.
  {% endif %}


[delayed_gcode _KEEP_HOT_OFF]
gcode:
  TURN_OFF_HEATERS
  SET_GCODE_VARIABLE MACRO=_KEEP_HOT_ARM VARIABLE=bed VALUE=0
  M118 KEEP_HOT: window over, heaters off


[gcode_macro KEEP_HOT]
description: Keep heaters on after cancel. KEEP_HOT ENABLE=0|1 MINUTES=n
gcode:
  {% set en = params.ENABLE|default(1)|int %}
  {% set mins = params.MINUTES|default(printer["gcode_macro _KEEP_HOT"].minutes)|int %}
  SET_GCODE_VARIABLE MACRO=_KEEP_HOT VARIABLE=enabled VALUE={en}
  SET_GCODE_VARIABLE MACRO=_KEEP_HOT VARIABLE=minutes VALUE={mins}
  M118 KEEP_HOT enabled={en} minutes={mins}
