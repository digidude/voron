######################################################################
##  macros/calibration.cfg  --  one-click wrappers for tuning routines
##  NICE-TO-HAVE (new). Each just runs the standard Klipper/Beacon
##  command with sensible settings and tells you what to do next.
##
##  When to re-run what:
##   CAL_PID_EXTRUDER / CAL_PID_BED  after changing a heater, thermistor,
##                           silicone sock, or if temps oscillate +/- 1-2C
##   CAL_INPUT_SHAPER        after belt tension / toolhead changes
##   CAL_BEACON_HOT          if Z or meshes look inconsistent
##   PA test                 per filament, in Orca (Calibration menu)
##   Flow test               per filament, in Orca (Calibration menu)
######################################################################


[gcode_macro CAL_PID_EXTRUDER]
description: PID-tune the hotend. CAL_PID_EXTRUDER TEMP=250
gcode:
  {% set temp = params.TEMP|default(250)|int %}
  G28
  G90
  G0 X125 Y125 Z10 F6000         # tune where it prints: near the bed
  M106 S64                       # part fan ~25% - like a real print
  PID_CALIBRATE HEATER=extruder TARGET={temp}
  M107
  M118 CAL_PID_EXTRUDER done - run SAVE_CONFIG to store the result


[gcode_macro CAL_PID_BED]
description: PID-tune the bed. CAL_PID_BED TEMP=105
gcode:
  {% set temp = params.TEMP|default(105)|int %}
  PID_CALIBRATE HEATER=heater_bed TARGET={temp}
  M118 CAL_PID_BED done - run SAVE_CONFIG to store the result


[gcode_macro CAL_INPUT_SHAPER]
description: Home, then measure resonances with Beacon's accelerometer
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SHAPER_CALIBRATE
  ## Don't SAVE_CONFIG here: [input_shaper] is written out in printer.cfg,
  ## and Klipper refuses to auto-save an option that's also set by hand.
  M118 Done - copy the recommended shaper type/freq for X and Y from the
  M118 console into [input_shaper] in printer.cfg, then FIRMWARE_RESTART.


[gcode_macro CAL_BEACON_HOT]
description: Rebuild Beacon's model on a heat-soaked bed. CAL_BEACON_HOT BED=105
gcode:
  {% set bed = params.BED|default(105)|int %}
  M140 S{bed}
  M104 S{printer["gcode_macro PRINT_START"].contact_temp}
  G28
  G0 X125 Y125 Z5 F6000
  M190 S{bed}
  M118 Soaking 10 min before calibrating...
  G4 P600000
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=160
  NOZZLE_CLEAN WIPES=2
  G28 Z METHOD=CONTACT CALIBRATE=1
  M118 Beacon model rebuilt. SAVE_CONFIG to keep it as the default model.


[gcode_macro CAL_FIRST_LAYER]
description: Print-ready nozzle at Z0.2 over bed centre to check the gap
## NICE-TO-HAVE: a quick paper/feeler check of where Z really is with the
## current offset. Runs a normal hot PRINT_START-style zero first.
gcode:
  {% set bed = params.BED|default(105)|int %}
  {% set hot = params.HOTEND|default(250)|int %}
  PRINT_START BED={bed} HOTEND={hot} MESH=0 SOAK=0
  G90
  G0 Z5 F1500
  G0 X125 Y125 F6000
  G0 Z0.2 F300
  M118 Nozzle is at Z0.2 (incl. z_hot_offset). Adjust with Mainsail babystep,
  M118 then add the babystep total to variable_z_hot_offset in print_start_end.cfg.
