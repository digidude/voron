######################################################################
##  VORON 2.4  (250 mm)  --  printer.cfg   (config_v2, 2026-10-03)
##
##  HOW KLIPPER READS THIS
##  ----------------------
##  * Klipper reads printer.cfg at startup (or on FIRMWARE_RESTART /
##    RESTART). Each [section] configures one "object" (a stepper, a
##    heater, a macro ...).
##  * [include x.cfg] pastes another file in at that point. Splitting the
##    config into files changes nothing for Klipper - it's just for us.
##  * If the same [section] appears twice, the later one's options win.
##    If a PIN is used twice, Klipper refuses to start (good safety net).
##  * Lines starting with # are comments. So is anything after " #" or
##    " ;" on a line.
##  * The block at the very bottom that starts with "#*#" is written by
##    Klipper itself when you run SAVE_CONFIG (PID values, Beacon model,
##    saved meshes). Never edit it by hand - and don't define the same
##    option above, or SAVE_CONFIG will complain.
##
##  BASELINE
##  --------
##  Layout follows the official Voron 2.4 / BTT Octopus reference config
##  (github.com/VoronDesign/Voron-2 -> firmware/klipper_configurations)
##  plus Beacon's official docs (docs.beacon3d.com). Every machine-
##  specific number (pins, currents, offsets, PID, input shaper,
##  rotation_distance, Beacon serial) was carried over from your
##  previous config. See README.md for the full list of changes.
######################################################################


######################################################################
##  INCLUDES
######################################################################

## Mainsail's standard macros: PAUSE / RESUME / CANCEL_PRINT, plus
## [virtual_sdcard], [pause_resume], [display_status].
## Included straight from the mainsail-config repo so updates through
## Mainsail's Update Manager apply automatically (your old setup used a
## stale copy). If your Pi user isn't "pi", fix the path.
[include /home/pi/mainsail-config/mainsail.cfg]

## --- Hardware: one file per physical subsystem ---
[include hardware/motors.cfg]          ## X/Y/Z steppers + TMC2209 drivers
[include hardware/extruder.cfg]        ## Clockwork 2 extruder + hotend heater
[include hardware/bed.cfg]             ## Bed heater (SSR) + thermistor
[include hardware/beacon.cfg]          ## Beacon probe, QGL, bed mesh, resonance tester
[include hardware/fans.cfg]            ## Part, hotend, controller, exhaust, Nevermore
[include hardware/leds.cfg]            ## Case lights + Stealthburner LEDs (+ hidden _STATUS_ macros)
[include hardware/sensors.cfg]         ## MCU / Pi temperatures (+ chamber template)

## --- Macros: what the printer *does* ---
## MACRO NAMING CONVENTION (keeps Mainsail's Macros panel tidy)
##   UPPER_CASE   = a command you run by hand -> shows as a button
##   _anything    = internal helper / console tool -> hidden in Mainsail
##   Prefixes group related buttons when sorted:
##     CAL_*      calibration            LIGHTS_*   lighting
##     NOZZLE_*   clean / prime / purge   PARK_*     toolhead parking
##   Kept as-is on purpose (standards other tools look for):
##     PRINT_START, PRINT_END (Orca start/end G-code), G32 (Voron),
##     M600, LOAD_FILAMENT / UNLOAD_FILAMENT (Mainsail & KlipperScreen
##     load/unload buttons), PAUSE / RESUME / CANCEL_PRINT (Mainsail)
##   Every visible macro has a description: (tooltip in Mainsail).
[include macros/print_start_end.cfg]   ## PRINT_START / PRINT_END (retry-aware)
[include macros/cancel_keep_hot.cfg]   ## Cancel parks + keeps heat for a fast retry
[include macros/nozzle_clean.cfg]      ## Brush wipe, bucket prime, purge line
[include macros/utility.cfg]           ## G32, PARK, PREHEAT, COOLDOWN, filament load/unload, M600
[include macros/calibration.cfg]       ## PID / input-shaper / PA / Beacon helper macros
[include macros/debug.cfg]             ## _DUMP_VARIABLES, _GET_VARIABLE

## --- Playground. Any *.cfg you drop in experimental/ is loaded. ---
## (Rename to .cfg.disabled to switch one off. Empty is fine.)
[include experimental/*.cfg]


######################################################################
##  MAIN CONTROLLER (BTT Octopus)
######################################################################

[mcu]
## The Octopus talks to the Pi over the Pi's hardware UART (GPIO 14/15),
## not USB. That's what /dev/ttyAMA0 is.
serial: /dev/ttyAMA0
restart_method: command


######################################################################
##  PRINTER KINEMATICS & LIMITS
######################################################################

[printer]
kinematics: corexy
## Hard ceilings. The slicer can ask for less (it sends SET_VELOCITY_LIMIT
## during the print) but never more.
max_velocity: 300            # mm/s
max_accel: 4000              # mm/s^2  (your previous value)
max_z_velocity: 25
max_z_accel: 350
## How fast the toolhead may take a 90-degree corner without slowing to
## zero. 5 is the Klipper default and a good value for a 2.4.
square_corner_velocity: 5.0


[input_shaper]
## Cancels frame/belt ringing ("ghosting"). Values came from your last
## SHAPER_CALIBRATE run. Re-run SHAPER_CALIBRATE after any mechanical
## change (belts, toolhead) - see macros/calibration.cfg.
shaper_type_x: ei
shaper_freq_x: 65.2
shaper_type_y: mzv
shaper_freq_y: 41.8


[idle_timeout]
## After this many seconds of doing nothing, Klipper turns off heaters
## AND motors. Turning motors off loses "homed" and the QGL, so the next
## print does the full routine.
## CHANGED: 7200 (2 h) -> 1800 (30 min). Two hours of a 105C bed with
## nobody around is a lot; 30 min still comfortably covers the 15-minute
## keep-hot-after-cancel window.
timeout: 1800


[respond]
## Lets macros print messages to the console (M118 / RESPOND).
default_type: echo
default_prefix:


[exclude_object]
## Lets you cancel a single failed part from Mainsail mid-print. Orca
## already writes the needed EXCLUDE_OBJECT_DEFINE lines, and the
## adaptive mesh uses the same data to only scan where parts are.


[gcode_arcs]
## NICE-TO-HAVE (new): understands G2/G3 arcs. Only matters if you turn
## on "Arc fitting" in Orca (smaller gcode, smoother curves). Harmless
## otherwise.
resolution: 0.1


[save_variables]
## NICE-TO-HAVE (new): a small file where macros can remember values
## across restarts (e.g. a tuned Z offset per material, or the Beacon
## thermal-expansion tool if you add it later).
filename: ~/printer_data/config/variables.cfg


